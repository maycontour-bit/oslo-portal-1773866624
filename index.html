<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Oslo Partners | Portal v4.0</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #08121a; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: #060c12; border-right: 1px solid #193D5A; padding: 30px; flex-shrink: 0; display: flex; flexDirection: column; }
        .main { flex-grow: 1; padding: 50px; overflow-y: auto; }
        .gold { color: #D4AF37; }
        .gold-bg { background: #D4AF37; color: #000; }
        .card { background: #122A42; border: 1px solid #193D5A; padding: 25px; border-radius: 15px; margin-bottom: 25px; }
        .res-card { background: #193D5A; border: 2px solid #D4AF37; padding: 35px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; margin-bottom: 10px; font-weight: bold; cursor: pointer; text-align: left; transition: 0.2s; background: transparent; color: #fff; }
        .btn:hover { background: rgba(25, 61, 90, 0.5); }
        .btn-active { background: #D4AF37 !important; color: #000 !important; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .prod-btn { padding: 10px; border: 1px solid #193D5A; border-radius: 8px; background: #0d1e2b; color: #fff; font-size: 11px; font-weight: bold; cursor: pointer; }
        .prod-active { background: #D4AF37; color: #000; border-color: #D4AF37; }
        input { width: 100%; background: #08121a; border: 1px solid #193D5A; color: #fff; padding: 15px; border-radius: 8px; font-size: 20px; font-weight: bold; outline: none; margin-top: 10px; }
        input:focus { border-color: #D4AF37; }
        label { font-size: 10px; font-weight: bold; letter-spacing: 1px; color: #D4AF37; text-transform: uppercase; }
        .hidden { display: none; }
        h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -1px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1 style="margin-bottom: 50px;">OSLO <span class="gold">PARTNERS</span></h1>
        <button id="nav-pj1" class="btn btn-active" onclick="showTab('pj1')">📈 INVESTIMENTOS</button>
        <button id="nav-pj2" class="btn" onclick="showTab('pj2')">💰 MULTI-PRODUTOS</button>
        <div style="margin-top: auto; font-size: 10px; opacity: 0.3;">MAYCON VALENTE | CHAIRMAN</div>
    </div>

    <div class="main">
        <div id="pj1-content">
            <h2 style="font-size: 32px; font-weight: 900; margin-bottom: 40px;">Simulador de Recorrência</h2>
            <div style="display: flex; gap: 30px;">
                <div class="card" style="flex: 1;">
                    <label>Captação Líquida (NNM) R$</label>
                    <input type="number" id="nnm" value="10000000" oninput="calc1()">
                    <br><br>
                    <label>ROA da Carteira (% a.a.)</label>
                    <input type="number" id="roa" value="0.70" step="0.05" oninput="calc1()">
                </div>
                <div class="res-card" style="flex: 1;">
                    <p style="font-size: 12px; font-weight: bold; opacity: 0.7;">SUA RECEITA MENSAL EST.</p>
                    <h1 id="res1" class="gold" style="font-size: 50px; margin: 20px 0;">R$ 23.333,33</h1>
                    <p style="font-size: 9px; opacity: 0.4;">Cálculo líquido (Pós-Imposto e Split)</p>
                </div>
            </div>
        </div>

        <div id="pj2-content" class="hidden">
            <h2 style="font-size: 32px; font-weight: 900; margin-bottom: 30px;">Multi-Produtos</h2>
            <div id="prod-grid" class="grid"></div>
            <div style="display: flex; gap: 30px;">
                <div class="card" style="flex: 1;">
                    <label id="unit-label">VALOR DA OPERAÇÃO R$</label>
                    <input type="number" id="val" value="1000000" oninput="calc2()">
                </div>
                <div class="res-card gold-bg" style="flex: 1; border: none;">
                    <p style="font-size: 12px; font-weight: bold; opacity: 0.6;">SEU GANHO LÍQUIDO</p>
                    <h1 id="res2" style="font-size: 56px; margin: 20px 0;">R$ 0,00</h1>
                    <p style="font-size: 10px; font-weight: bold;">PAGAMENTO UPFRONT</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const rules = {
            'af': { n: 'American Fidelity', b: 70, m: 35, a: 35, e: 30, u: 'Prêmio US$' },
            'finep': { n: 'Captação (Finep)', b: 3, m: 10, a: 40, e: 50, u: 'Deal R$' },
            'ma': { n: 'M&A (Deal)', b: 0.8, m: 30, a: 20, e: 50, u: 'Deal R$' },
            'mkt': { n: 'Mercado Capitais', b: 2, m: 30, a: 20, e: 50, u: 'Deal R$' },
            'he': { n: 'Home Equity', b: 3.5, m: 20, a: 40, e: 40, u: 'Crédito R$' },
            'trust': { n: 'Trust Offshore', b: 45, m: 20, a: 40, e: 40, u: 'Aporte R$' },
            'spec': { n: 'Special Situations', b: 15, m: 13.3, a: 53.3, e: 33.3, u: 'Volume R$' },
            'cons': { n: 'Consórcios', b: 2, m: 35, a: 35, e: 30, u: 'Carta R$' },
            'seg': { n: 'Seguros Nacionais', b: 40, m: 35, a: 35, e: 30, u: 'Prêmio R$' },
            'fx': { n: 'Câmbio (Spread)', b: 1, m: 10, a: 35, e: 55, u: 'Volume R$' },
            'imob': { n: 'Financ. Imob.', b: 1, m: 0, a: 50, e: 50, u: 'Financ. R$' },
            'gest': { n: 'Gestão Patrim.', b: 1, m: 0, a: 50, e: 50, u: 'Operação R$' }
        };

        let active = 'af';

        function showTab(tab) {
            document.getElementById('pj1-content').classList.toggle('hidden', tab !== 'pj1');
            document.getElementById('pj2-content').classList.toggle('hidden', tab !== 'pj2');
            document.getElementById('nav-pj1').classList.toggle('btn-active', tab === 'pj1');
            document.getElementById('nav-pj2').classList.toggle('btn-active', tab === 'pj2');
        }

        function build() {
            const grid = document.getElementById('prod-grid');
            for (let id in rules) {
                const b = document.createElement('button');
                b.className = 'prod-btn';
                if(id === active) b.className += ' prod-active';
                b.innerText = rules[id].n;
                b.onclick = () => {
                    active = id;
                    document.querySelectorAll('.prod-btn').forEach(x => x.className = 'prod-btn');
                    b.className = 'prod-btn prod-active';
                    document.getElementById('unit-label').innerText = rules[id].u;
                    calc2();
                };
                grid.appendChild(b);
            }
        }

        const fmt = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);

        function calc1() {
            const nnm = document.getElementById('nnm').value;
            const roa = document.getElementById('roa').value;
            const gain = ((nnm * (roa/100)) * 0.8 * 0.5) / 12;
            document.getElementById('res1').innerText = fmt(gain);
        }

        function calc2() {
            const val = document.getElementById('val').value;
            const r = rules[active];
            let gross = (active === 'af') ? (val * 5.2 * (r.b/100)) : (val * (r.b/100));
            const share = (gross * 0.8) * (1 - r.m/100) * (r.a / (r.a + r.e));
            document.getElementById('res2').innerText = fmt(share);
        }

        build();
        calc1();
        calc2();
    </script>
</body>
</html>
