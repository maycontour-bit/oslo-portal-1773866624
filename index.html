<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Oslo Partners | Portal v5.0</title>
</head>
<body style="background: #08121a; color: white; font-family: sans-serif; margin: 0; padding: 0;">
    <div style="display: flex; height: 100vh;">
        <div style="width: 250px; background: #060c12; border-right: 2px solid #193D5A; padding: 20px;">
            <h1 style="color: #D4AF37; font-size: 20px; margin-bottom: 40px;">OSLO PARTNERS</h1>
            <div id="nav-pj1" style="background: #D4AF37; color: black; padding: 10px; margin-bottom: 10px; border-radius: 5px; font-weight: bold; cursor: pointer;" onclick="show('pj1')">INVESTIMENTOS</div>
            <div id="nav-pj2" style="background: #122A42; color: white; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer;" onclick="show('pj2')">PRODUTOS</div>
        </div>
        <div style="flex: 1; padding: 40px;">
            <div id="pj1">
                <h2>Simulador PJ1</h2>
                <div style="background: #122A42; padding: 20px; border-radius: 10px; margin-top: 20px;">
                    <label>Captação (R$)</label><br>
                    <input type="number" id="nnm" value="10000000" style="width: 100%; padding: 10px; margin: 10px 0;" oninput="calc()">
                    <br><label>ROA (%)</label><br>
                    <input type="number" id="roa" value="0.70" step="0.05" style="width: 100%; padding: 10px; margin: 10px 0;" oninput="calc()">
                    <div style="background: #193D5A; padding: 20px; margin-top: 20px; text-align: center; border: 1px solid #D4AF37;">
                        <span>GANHO MENSAL EST.:</span>
                        <h1 id="res1" style="color: #D4AF37;">R$ 23.333,33</h1>
                    </div>
                </div>
            </div>
            <div id="pj2" style="display: none;">
                <h2>Ecossistema</h2>
                <div id="btns" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin: 20px 0;"></div>
                <div style="background: #122A42; padding: 20px; border-radius: 10px;">
                    <label id="unit">Volume</label><br>
                    <input type="number" id="val" value="1000000" style="width: 100%; padding: 10px;" oninput="calc()">
                    <div style="background: #D4AF37; color: black; padding: 20px; margin-top: 20px; text-align: center; font-weight: bold;">
                        <span>GANHO LÍQUIDO:</span>
                        <h1 id="res2">R$ 0,00</h1>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const r = {
            'AF': [70, 35, 35, 30, 'Prêmio US$'],
            'Finep': [3, 10, 40, 50, 'Deal R$'],
            'M&A': [0.8, 30, 20, 50, 'Deal R$'],
            'MktCap': [2, 30, 20, 50, 'Deal R$'],
            'HE': [3.5, 20, 40, 40, 'Crédito R$'],
            'Trust': [45, 20, 40, 40, 'Aporte R$'],
            'Spec': [15, 13.3, 53.3, 33.3, 'Volume R$'],
            'Cons': [2, 35, 35, 30, 'Carta R$'],
            'SegNac': [40, 35, 35, 30, 'Prêmio R$'],
            'Cambio': [1, 10, 35, 55, 'Volume R$'],
            'Imob': [1, 0, 50, 50, 'Financ. R$'],
            'Gest': [1, 0, 50, 50, 'Operação R$']
        };
        let act = 'AF';
        const f = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
        function show(id) {
            document.getElementById('pj1').style.display = id === 'pj1' ? 'block' : 'none';
            document.getElementById('pj2').style.display = id === 'pj2' ? 'block' : 'none';
            document.getElementById('nav-pj1').style.background = id === 'pj1' ? '#D4AF37' : '#122A42';
            document.getElementById('nav-pj1').style.color = id === 'pj1' ? 'black' : 'white';
            document.getElementById('nav-pj2').style.background = id === 'pj2' ? '#D4AF37' : '#122A42';
            document.getElementById('nav-pj2').style.color = id === 'pj2' ? 'black' : 'white';
        }
        function calc() {
            const n = document.getElementById('nnm').value;
            const ro = document.getElementById('roa').value;
            document.getElementById('res1').innerText = f(((n * (ro/100)) * 0.8 * 0.5) / 12);
            const v = document.getElementById('val').value;
            const p = r[act];
            let g = (act === 'AF') ? (v * 5.2 * (p[0]/100)) : (v * (p[0]/100));
            document.getElementById('res2').innerText = f((g * 0.8) * (1 - p[1]/100) * (p[2] / (p[2] + p[3])));
        }
        const bdiv = document.getElementById('btns');
        for (let k in r) {
            const b = document.createElement('button');
            b.innerText = k;
            b.style = "padding: 5px; font-size: 10px; cursor: pointer;";
            b.onclick = () => { act = k; document.getElementById('unit').innerText = r[k][4]; calc(); };
            bdiv.appendChild(b);
        }
        calc();
    </script>
</body>
</html>
